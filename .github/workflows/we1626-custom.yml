name: WE1626 custom MT7620N source build (NOT FOR FLASHING)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - boards/**
      - .github/workflows/we1626-custom.yml
      - overlay/**

permissions:
  contents: read

jobs:
  custom-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3 rsync \
            unzip wget zlib1g-dev file subversion swig time curl xsltproc zstd \
            libelf-dev squashfs-tools ca-certificates
      - name: Validate source-build scripts
        run: |
          bash -n boards/build_custom.sh
          python3 -m py_compile boards/patch_openwrt.py boards/audit_custom.py
          sh -n overlay/etc/uci-defaults/99-heatbridge-open-setup
          sh -n overlay/etc/uci-defaults/98-heatbridge
          sh -n overlay/usr/sbin/heatbridge-mqtt
          sh -n overlay/usr/sbin/heatbridge-discover
          sh -n overlay/www/heatbridge/cgi-bin/api
          python3 -m unittest discover -s tests -v
      - name: Compile dedicated WE1626 experimental MT7620N target
        run: bash ./boards/build_custom.sh
      - name: Audit partition boundaries, kernel CRC, footer and embedded tools
        run: python3 boards/audit_custom.py
      - name: Upload experimental firmware and preflight result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WE1626-MT7620N-CUSTOM-UNVERIFIED
          path: output-custom/
          retention-days: 7
          if-no-files-found: warn

