name: Ballu direct Alice bridge checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - cloud/**
      - tests/test_alice*.py
      - tests/test_entware.py
      - entware/bin/heatbridge-device
      - entware/www/**
      - .github/workflows/alice-check.yml
  push:
    branches: [main]
    paths:
      - cloud/**
      - tests/test_alice*.py
      - tests/test_disk_ui.cjs
      - entware/bin/heatbridge-device
      - entware/www/**
      - .github/workflows/alice-check.yml
permissions:
  contents: read
jobs:
  check-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install native build and emulation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev python3-cryptography jq qemu-user
      - name: Validate optional router scripts and cloud provider
        run: |
          for script in cloud/router/*; do sh -n "$script"; done
          sh -n entware/www/cgi-bin/disk-api
          node --check entware/www/disk.js
          node --check entware/www/app.js
          node tests/test_disk_ui.cjs
          python3 -m unittest discover -s tests -p 'test_alice*.py' -v
          python3 -m unittest discover -s tests -p 'test_entware.py' -v
          bash entware/build.sh
          SYNCLEO_TEST_BINARY=output-entware/usb-root/heatbridge-entware/bin/heatbridge-syncleo SYNCLEO_RUNNER=qemu-mipsel python3 -m unittest discover -s tests -p test_syncleo.py -v
          python3 cloud/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Ballu-Alice-Bridge-Preview
          path: output-alice/
          retention-days: 14
          if-no-files-found: error
