name: Build OpenWrt experimental images - DO NOT FLASH
on:
  push:
    branches: [main]
    paths:
      - build.sh
      - .github/workflows/build.yml
      - overlay/**
      - tools/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install build and audit dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd make curl ca-certificates squashfs-tools
      - name: Validate open Wi-Fi bootstrap and Heat Bridge
        run: |
          bash -n build.sh
          sh -n overlay/etc/uci-defaults/98-heatbridge
          sh -n overlay/etc/uci-defaults/99-heatbridge-open-setup
          sh -n overlay/etc/hotplug.d/net/90-dh-zte-wan
          sh -n overlay/usr/sbin/heatbridge-enable
          sh -n overlay/www/heatbridge/cgi-bin/api
          grep -Fq 'encryption=none' overlay/etc/uci-defaults/99-heatbridge-open-setup
          grep -Fq 'network.wanusb.disabled=1' overlay/etc/uci-defaults/99-heatbridge-open-setup
          test ! -f overlay/etc/uci-defaults/99-heatbridge-usb-setup
          python3 - <<'PY'
          from pathlib import Path
          html=Path('overlay/www/heatbridge/index.html').read_text()
          assert "real_commands_sent" in html
          assert "<script>" in html and "</script>" in html
          Path('/tmp/heatbridge-ui.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0])
          PY
          node --check /tmp/heatbridge-ui.js
      - name: Build experimental images without secrets
        run: bash ./build.sh
      - name: Audit WE2026 images
        run: python3 tools/audit_image.py output
      - name: Audit Keenetic Omni II factory format
        run: python3 tools/audit_factory.py output
      - name: Audit optional factory image with LuCI
        run: python3 tools/audit_factory_webui.py output
      - name: Save unverified candidates and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WE1626-CANDIDATES-NOT-FOR-FLASHING
          path: output/
          if-no-files-found: warn
          retention-days: 7
