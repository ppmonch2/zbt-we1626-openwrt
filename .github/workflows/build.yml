name: Build OpenWrt candidates - DO NOT FLASH
on:
  push:
    branches: [main]
    paths:
      - build.sh
      - .github/workflows/build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install builder tools
        run: sudo apt-get update && sudo apt-get install -y zstd make curl ca-certificates
      - name: Build experimental candidates without secrets
        run: bash ./build.sh
      - name: Upload diagnostics and unverified images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WE1626-CANDIDATES-NOT-FOR-FLASHING
          path: output/
          if-no-files-found: warn
          retention-days: 7
