name: Publish direct Alice preview files
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-alice-preview.yml
permissions:
  contents: read
concurrency:
  group: alice-preview-0.1.1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 31217918dc4528d9112471d59d1e9b9aeb393c67
      - name: Test and package the reviewed preview source
        run: |
          python3 -m unittest discover -s tests -p test_alice.py -v
          python3 cloud/package.py
          for script in cloud/router/*; do sh -n "$script"; done
      - name: Publish immutable preview assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view ballu-alice-preview-v0.1.1 >/dev/null 2>&1; then
            echo 'Preview already exists; refusing to replace published files.'
            exit 1
          fi
          gh release create ballu-alice-preview-v0.1.1 \
            output-alice/Ballu-Alice-Function.zip output-alice/Ballu-Alice-Router.tar.gz output-alice/SHA256SUMS \
            --target 31217918dc4528d9112471d59d1e9b9aeb393c67 \
            --prerelease --title 'Ballu direct Alice bridge 0.1.1 — cloud setup preview' \
            --notes 'Preview for manual cloud setup. 19 offline tests pass. Cloud resources, owner OAuth binding, delivery through Yandex and real router latency are not yet verified. The router installer does not start the agent. No credentials are included. See cloud/README_RU.md in the tagged source.'
